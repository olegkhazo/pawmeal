services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pawmeal
      POSTGRES_PASSWORD: pawmeal
      POSTGRES_DB: pawmeal
    ports:
      - "5432:5432"
    volumes:
      - pawmeal_db_data:/var/lib/postgresql/data

volumes:
  pawmeal_db_data:
